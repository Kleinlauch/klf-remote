<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Desktop</title>
    <style>
        /* Frutiger Aero Grunddesign */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #aed1f4 0%, #d4e8f9 50%, #b2d5a3 100%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #333;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Glassmorphism / Glossy Container */
        .aero-container {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 0 10px rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            padding: 40px;
            text-align: center;
            width: 80%;
            max-width: 800px;
        }

        h1 {
            color: #0d4b75;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.8);
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .aero-btn {
            background: linear-gradient(to bottom, rgba(255,255,255,0.9) 0%, rgba(220,235,250,0.8) 50%, rgba(190,215,240,0.8) 51%, rgba(200,225,245,0.9) 100%);
            border: 1px solid #8ca6c2;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            text-decoration: none;
            color: #1a4a6b;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1), inset 0 2px 3px rgba(255,255,255,0.9);
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80px;
        }

        .aero-btn:hover:not(.disabled) {
            background: linear-gradient(to bottom, rgba(255,255,255,1) 0%, rgba(230,245,255,0.9) 50%, rgba(200,225,250,0.9) 51%, rgba(210,235,255,1) 100%);
            border-color: #5a8ab8;
            box-shadow: 0 4px 12px rgba(0,100,200,0.3), inset 0 2px 3px rgba(255,255,255,0.9);
            transform: translateY(-2px);
        }

        .aero-btn.disabled {
            background: linear-gradient(to bottom, rgba(220,220,220,0.7) 0%, rgba(200,200,200,0.7) 100%);
            color: #888;
            border-color: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Pages */
        #startPage, #remotePage { display: none; }
        #startPage.active, #remotePage.active { display: block; }

        /* Win7 PIN Modal */
        #pinModalOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none; justify-content: center; align-items: center; z-index: 9999;
        }
        .win7-dialog {
            width: 380px; background: rgba(220, 230, 240, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6), inset 0 0 3px rgba(255,255,255,0.8);
            padding: 6px; backdrop-filter: blur(10px);
        }
        .win7-titlebar {
            background: linear-gradient(to bottom, #e4effb 0%, #b5cce6 50%, #9cbbe0 51%, #aed1f4 100%);
            padding: 6px 10px; border-radius: 5px 5px 0 0;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.7); box-shadow: inset 0 1px 1px rgba(255,255,255,0.8);
        }
        .win7-title { font-size: 12px; text-shadow: 0 0 5px rgba(255,255,255,1); }
        .win7-close {
            background: linear-gradient(to bottom, #e0a3a3 0%, #c43838 50%, #a01010 51%, #d94a4a 100%);
            border: 1px solid #7c1a1a; border-radius: 3px; width: 38px; height: 18px; cursor: pointer;
        }
        .win7-content {
            background: #f0f0f0; border: 1px solid #999; margin-top: 2px; padding: 20px; font-size: 12px;
        }
        .win7-controls { display: flex; align-items: center; gap: 10px; margin-top: 15px; }
        .win7-input { flex-grow: 1; padding: 3px; border: 1px solid #abadb3; }
        .win7-btn {
            background: linear-gradient(to bottom, #f2f2f2 0%, #ebebeb 50%, #dddddd 51%, #cfcfcf 100%);
            border: 1px solid #707070; border-radius: 3px; padding: 3px 20px; cursor: pointer;
        }

        /* Loading Screen */
        #loadingOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 9998;
            color: #fff;
        }
        .loader {
            border: 6px solid rgba(255,255,255,0.2);
            border-top: 6px solid #4a90e2;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .progress-container { width: 200px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: #4a90e2; transition: width 0.3s; }

        /* Video Container & Remote Controls */
        #videoContainer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; justify-content: center; align-items: center;
            transition: all 0.3s ease;
        }
        #videoContainer.shrink {
            height: calc(100% - 100px); /* Platz fuer Leisten */
            top: 50px;
        }
        video { max-width: 100%; max-height: 100%; object-fit: contain; cursor: crosshair; }

        /* Leisten (Top / Bottom) */
        .bar {
            position: absolute; left: 0; width: 100%; height: 50px;
            background: linear-gradient(to bottom, rgba(50,50,50,0.9), rgba(20,20,20,0.9));
            color: white; display: flex; align-items: center; padding: 0 20px; box-sizing: border-box;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .bar.visible { opacity: 1; pointer-events: auto; }
        #topBar { top: 0; justify-content: space-between; border-bottom: 1px solid #444; }
        #bottomBar { bottom: 0; justify-content: space-between; border-top: 1px solid #444; }

        .bar button {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 5px 15px; border-radius: 5px; cursor: pointer; margin-right: 10px;
        }
        .bar button:hover { background: rgba(255,255,255,0.2); }
        .bar-info { font-size: 14px; color: #ccc; }
        .jiggler-active { color: #5cb85c !important; border-color: #5cb85c !important; }
    </style>
</head>
<body>

    <!-- Startseite -->
    <div id="startPage" class="active aero-container">
        <h1>Willkommen</h1>
        <div class="grid">
            <a href="https://kleinlauch.github.io/klf" target="_blank" class="aero-btn">KLF WEB</a>
            <a href="https://nc.schillerschuledettingen.de/nextcloud/login" target="_blank" class="aero-btn">NextCloud-SSD</a>
            <a href="https://schillerschuledettingen.webuntis.com/WebUntis/?school=schillerschuledettingen#/basic/login" target="_blank" class="aero-btn">Untis</a>
            <div class="aero-btn" onclick="showPage('remotePage')">Remote Control</div>
        </div>
    </div>

    <!-- Remote Auswahl -->
    <div id="remotePage" class="aero-container">
        <h1>Gerät auswählen</h1>
        <div class="grid">
            <div class="aero-btn" onclick="openPinModal('DesktopPC')">DesktopPC</div>
            <div class="aero-btn disabled">HP Laptop</div>
            <div class="aero-btn disabled">Lenovo Notebook</div>
            <div class="aero-btn disabled">DELL Latitude</div>
        </div>
        <br>
        <button class="aero-btn" style="height: 40px; width: 150px; margin: 0 auto;" onclick="showPage('startPage')">Zurück</button>
    </div>

    <!-- Win 7 PIN Modal -->
    <div id="pinModalOverlay">
        <div class="win7-dialog">
            <div class="win7-titlebar">
                <span class="win7-title">Windows-Sicherheit</span>
                <div class="win7-close" onclick="closePinModal()"></div>
            </div>
            <div class="win7-content">
                <div>Authentifizierung für <b id="targetPcName"></b> erforderlich.</div>
                <div class="win7-controls">
                    <label for="pinInput">PIN:</label>
                    <input type="password" id="pinInput" class="win7-input">
                    <button id="pinSubmit" class="win7-btn">OK</button>
                </div>
                <div id="pinError" style="color:red; margin-top:10px; display:none;">Falsche PIN.</div>
            </div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loadingOverlay">
        <div class="loader"></div>
        <div>Verbindungsaufbau...</div>
        <div class="progress-container" style="margin-top: 10px;">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>

    <!-- Remote Control Container -->
    <div id="videoContainer">
        <!-- Top Bar -->
        <div id="topBar" class="bar">
            <div>
                <button onclick="toggleFullscreen()">Vollbild an/aus</button>
                <button onclick="sendAction('shutdown')">Host Herunterfahren</button>
                <button onclick="sendAction('cd_drive')">CD Laufwerk (Auf/Zu)</button>
                <button id="jigglerBtn" onclick="toggleJiggler()">Zeiger wackeln</button>
                <select id="qualitySelect" onchange="changeQuality()" style="padding: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 5px;">
                    <option value="1.0">Qualität: 100%</option>
                    <option value="0.75">Qualität: 75%</option>
                    <option value="0.5">Qualität: 50%</option>
                </select>
            </div>
            <div>
                <button onclick="backToStream()" style="background: #4a90e2; border-color: #4a90e2;">Zurück zum Stream</button>
                <button onclick="exitRemote()">Zurück zur Startseite</button>
            </div>
        </div>

        <video id="remoteVideo" autoplay playsinline></video>

        <!-- Bottom Bar -->
        <div id="bottomBar" class="bar">
            <div class="bar-info" id="activeHostName">DesktopPC</div>
            <div style="display:flex; gap: 20px;">
                <div class="bar-info" id="pingDisplay">Latenz: -- ms</div>
                <div class="bar-info" id="timeDisplay">00:00:00</div>
                <div class="bar-info" id="dateDisplay">00.00.0000</div>
            </div>
        </div>
    </div>

    <script>
        const TARGET_HASH = "5322cc91aff6372f30d78585e6a14079bd8666560a3328c9bd8d3ae3358325a3b4172d054eda8d4808ab3beea75d7ebbdaaa47b9758259a032bfa4d177637a10";
        const PIESOCKET_API_KEY = "dNUjU3XDvFsQcLKs4BQ3q1Q2opjuDVSW7sqRb5b9";
        const CLUSTER_ID = "free.blr2"; 
        const SIGNALING_URL = `wss://${CLUSTER_ID}.piesocket.com/v3/1?api_key=${PIESOCKET_API_KEY}&notify_self=0`;

        let ws, pc, dataChannel;
        let wakeLock = null;
        let pingInterval;
        let currentHost = "";
        let jigglerActive = false;

        // UI Navigation
        function showPage(pageId) {
            document.getElementById('startPage').classList.remove('active');
            document.getElementById('remotePage').classList.remove('active');
            document.getElementById(pageId).classList.add('active');
        }

        function openPinModal(pcName) {
            currentHost = pcName;
            document.getElementById('targetPcName').innerText = pcName;
            document.getElementById('activeHostName').innerText = pcName;
            document.getElementById('pinModalOverlay').style.display = 'flex';
            document.getElementById('pinInput').focus();
        }

        function closePinModal() {
            document.getElementById('pinModalOverlay').style.display = 'none';
            document.getElementById('pinInput').value = '';
            document.getElementById('pinError').style.display = 'none';
        }

        async function sha512(str) {
            const buffer = new TextEncoder("utf-8").encode(str);
            const hashBuffer = await crypto.subtle.digest("SHA-512", buffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        document.getElementById('pinSubmit').addEventListener('click', async () => {
            const hash = await sha512(document.getElementById('pinInput').value);
            if (hash === TARGET_HASH) {
                closePinModal();
                startRemoteSession();
            } else {
                document.getElementById('pinError').style.display = 'block';
                document.getElementById('pinInput').value = '';
            }
        });
        document.getElementById('pinInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('pinSubmit').click(); });

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
        }

        function startRemoteSession() {
            document.getElementById('remotePage').classList.remove('active');
            document.getElementById('startPage').classList.remove('active');
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            // Ladebalken Simulation bis WebRTC steht
            let prog = 0;
            const progInt = setInterval(() => {
                prog += 10;
                if(prog > 90) clearInterval(progInt);
                document.getElementById('progressBar').style.width = prog + '%';
            }, 200);

            // Fullscreen anfordern (durch User Klick auf PIN OK legitimiert)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(()=>{});
            }
            
            requestWakeLock();
            initConnection();
        }

        function exitRemote() {
            if (ws) ws.close();
            if (pc) pc.close();
            if (pingInterval) clearInterval(pingInterval);
            if (wakeLock) wakeLock.release();
            
            if (document.fullscreenElement) document.exitFullscreen();
            
            document.getElementById('videoContainer').style.display = 'none';
            document.getElementById('videoContainer').classList.remove('shrink');
            document.getElementById('topBar').classList.remove('visible');
            document.getElementById('bottomBar').classList.remove('visible');
            showPage('startPage');
        }

        // WebRTC Connection
        function initConnection() {
            ws = new WebSocket(SIGNALING_URL);

            ws.onopen = async () => {
                pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.addTransceiver('video', { direction: 'recvonly' });
                pc.addTransceiver('audio', { direction: 'recvonly' });

                dataChannel = pc.createDataChannel('control');
                dataChannel.onopen = () => {
                    // Start Ping
                    pingInterval = setInterval(() => {
                        if (dataChannel.readyState === 'open') {
                            dataChannel.send(JSON.stringify({ type: 'ping', ts: Date.now() }));
                        }
                    }, 2000);
                };
                
                dataChannel.onmessage = (e) => {
                    const data = JSON.parse(e.data);
                    if (data.type === 'pong') {
                        const latency = Date.now() - data.ts;
                        document.getElementById('pingDisplay').innerText = `Latenz: ${latency} ms`;
                    }
                };

                setupInputEvents();

                pc.ontrack = (event) => {
                    const video = document.getElementById('remoteVideo');
                    if (video.srcObject !== event.streams[0]) {
                        video.srcObject = event.streams[0];
                        
                        // Stream aktiv -> Ladebildschirm weg
                        setTimeout(() => {
                            document.getElementById('progressBar').style.width = '100%';
                            setTimeout(() => {
                                document.getElementById('loadingOverlay').style.display = 'none';
                                document.getElementById('videoContainer').style.display = 'flex';
                                updateClock();
                                setInterval(updateClock, 1000);
                            }, 300);
                        }, 500);
                    }
                };

                pc.onicecandidate = (event) => {
                    if (event.candidate) ws.send(JSON.stringify({ ice: event.candidate }));
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                ws.send(JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }));
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                if (data.sdp) await pc.setRemoteDescription(new RTCSessionDescription(data));
                else if (data.ice) await pc.addIceCandidate(new RTCIceCandidate(data.ice));
            };
        }

        // Steuerung & Menü
        const video = document.getElementById('remoteVideo');
        const vContainer = document.getElementById('videoContainer');
        
        function setupInputEvents() {
            video.addEventListener('mousemove', (e) => {
                if (jigglerActive) {
                    jigglerActive = false;
                    document.getElementById('jigglerBtn').classList.remove('jiggler-active');
                }
                if (dataChannel && dataChannel.readyState === 'open' && !vContainer.classList.contains('shrink')) {
                    const rect = video.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width;
                    const y = (e.clientY - rect.top) / rect.height;
                    if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                        dataChannel.send(JSON.stringify({ type: 'mousemove', x: x, y: y }));
                    }
                }
            });

            video.addEventListener('mousedown', (e) => {
                if (dataChannel && dataChannel.readyState === 'open' && !vContainer.classList.contains('shrink')) {
                    dataChannel.send(JSON.stringify({ type: 'click', button: e.button }));
                }
            });

            document.addEventListener('keydown', (e) => {
                if (vContainer.style.display === 'flex' && !vContainer.classList.contains('shrink') && dataChannel && dataChannel.readyState === 'open') {
                    dataChannel.send(JSON.stringify({ type: 'keydown', key: e.key }));
                    e.preventDefault();
                }
            });

            document.addEventListener('keyup', (e) => {
                if (vContainer.style.display === 'flex' && !vContainer.classList.contains('shrink') && dataChannel && dataChannel.readyState === 'open') {
                    dataChannel.send(JSON.stringify({ type: 'keyup', key: e.key }));
                    e.preventDefault();
                }
            });
        }

        // Menü Trigger (Maus unten rechts)
        document.addEventListener('mousemove', (e) => {
            if (vContainer.style.display === 'flex' && !vContainer.classList.contains('shrink')) {
                if (e.clientX > window.innerWidth - 100 && e.clientY > window.innerHeight - 100) {
                    vContainer.classList.add('shrink');
                    document.getElementById('topBar').classList.add('visible');
                    document.getElementById('bottomBar').classList.add('visible');
                }
            }
        });

        function backToStream() {
            vContainer.classList.remove('shrink');
            document.getElementById('topBar').classList.remove('visible');
            document.getElementById('bottomBar').classList.remove('visible');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        function sendAction(action) {
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify({ type: action }));
            }
        }

        function toggleJiggler() {
            jigglerActive = !jigglerActive;
            const btn = document.getElementById('jigglerBtn');
            if (jigglerActive) btn.classList.add('jiggler-active');
            else btn.classList.remove('jiggler-active');
            
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify({ type: 'jiggler', active: jigglerActive }));
            }
        }
        
        function changeQuality() {
            const val = parseFloat(document.getElementById('qualitySelect').value);
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify({ type: 'quality', value: val }));
            }
        }

        function updateClock() {
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' + 
                            String(now.getMinutes()).padStart(2, '0') + ':' + 
                            String(now.getSeconds()).padStart(2, '0');
            const dateStr = String(now.getDate()).padStart(2, '0') + '.' + 
                            String(now.getMonth()+1).padStart(2, '0') + '.' + 
                            now.getFullYear();
            document.getElementById('timeDisplay').innerText = timeStr;
            document.getElementById('dateDisplay').innerText = dateStr;
        }
    </script>
</body>
</html>
