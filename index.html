<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Control Client</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: sans-serif;
        }
        #videoContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            display: none; /* Versteckt bis PIN korrekt */
        }
        video {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            cursor: crosshair;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            pointer-events: none;
        }

        /* Windows 7 Aero Style Modal */
        #pinModalOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .win7-dialog {
            width: 380px;
            background: rgba(220, 230, 240, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6), inset 0 0 3px rgba(255,255,255,0.8);
            padding: 6px;
            backdrop-filter: blur(10px);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #000;
        }
        .win7-titlebar {
            background: linear-gradient(to bottom, #e4effb 0%, #b5cce6 50%, #9cbbe0 51%, #aed1f4 100%);
            padding: 6px 10px;
            border-radius: 5px 5px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.8);
        }
        .win7-title {
            font-size: 12px;
            text-shadow: 0 0 5px rgba(255,255,255,1);
        }
        .win7-close {
            background: linear-gradient(to bottom, #e0a3a3 0%, #c43838 50%, #a01010 51%, #d94a4a 100%);
            border: 1px solid #7c1a1a;
            border-radius: 3px;
            width: 38px;
            height: 18px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4);
        }
        .win7-content {
            background: #f0f0f0;
            border: 1px solid #999;
            margin-top: 2px;
            padding: 20px;
            font-size: 12px;
        }
        .win7-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }
        .win7-input {
            flex-grow: 1;
            padding: 3px;
            border: 1px solid #abadb3;
        }
        .win7-btn {
            background: linear-gradient(to bottom, #f2f2f2 0%, #ebebeb 50%, #dddddd 51%, #cfcfcf 100%);
            border: 1px solid #707070;
            border-radius: 3px;
            padding: 3px 20px;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 12px;
            cursor: pointer;
        }
        .win7-btn:hover {
            background: linear-gradient(to bottom, #eaf6fd 0%, #d9f0fc 50%, #bee6fd 51%, #a7d9f5 100%);
            border-color: #3c7fb1;
        }
        #pinError {
            color: red;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Windows 7 PIN Modal -->
    <div id="pinModalOverlay">
        <div class="win7-dialog">
            <div class="win7-titlebar">
                <span class="win7-title">Windows-Sicherheit</span>
                <div class="win7-close"></div>
            </div>
            <div class="win7-content">
                <div>Der Server fordert eine Authentifizierung. Bitte geben Sie Ihre PIN ein, um auf den Remote-Desktop zuzugreifen.</div>
                <div class="win7-controls">
                    <label for="pinInput">PIN:</label>
                    <input type="password" id="pinInput" class="win7-input">
                    <button id="pinSubmit" class="win7-btn">OK</button>
                </div>
                <div id="pinError">Die eingegebene PIN ist falsch.</div>
            </div>
        </div>
    </div>

    <!-- Video Area -->
    <div id="videoContainer">
        <!-- Audio und Video aktiv. Muted muss false sein, damit Ton ankommt -->
        <video id="remoteVideo" autoplay playsinline></video>
        <div id="status">Verbinde zum Signaling Server...</div>
    </div>

    <script>
        const TARGET_HASH = "5322cc91aff6372f30d78585e6a14079bd8666560a3328c9bd8d3ae3358325a3b4172d054eda8d4808ab3beea75d7ebbdaaa47b9758259a032bfa4d177637a10";
        const PIESOCKET_API_KEY = "dNUjU3XDvFsQcLKs4BQ3q1Q2opjuDVSW7sqRb5b9";
        const CLUSTER_ID = "free.blr2"; 
        const SIGNALING_URL = `wss://${CLUSTER_ID}.piesocket.com/v3/1?api_key=${PIESOCKET_API_KEY}&notify_self=0`;

        const videoContainer = document.getElementById('videoContainer');
        const pinModalOverlay = document.getElementById('pinModalOverlay');
        const pinInput = document.getElementById('pinInput');
        const pinSubmit = document.getElementById('pinSubmit');
        const pinError = document.getElementById('pinError');
        const video = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        
        let ws;
        let pc;
        let dataChannel;

        // Funktion zum Hashen der PIN mit SHA-512
        async function sha512(str) {
            const buffer = new TextEncoder("utf-8").encode(str);
            const hashBuffer = await crypto.subtle.digest("SHA-512", buffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // PIN-Überprüfung
        pinSubmit.addEventListener('click', async () => {
            const enteredPin = pinInput.value;
            const hash = await sha512(enteredPin);
            
            if (hash === TARGET_HASH) {
                pinModalOverlay.style.display = 'none';
                videoContainer.style.display = 'flex';
                initConnection();
            } else {
                pinError.style.display = 'block';
                pinInput.value = '';
            }
        });

        // Auch Enter-Taste in der PIN-Box erlauben
        pinInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                pinSubmit.click();
            }
        });

        function updateStatus(text) {
            statusDiv.innerText = text;
        }

        function initConnection() {
            ws = new WebSocket(SIGNALING_URL);

            ws.onopen = async () => {
                updateStatus("Verbunden. Starte WebRTC...");
                
                pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                // Nach Video UND Audio fragen
                pc.addTransceiver('video', { direction: 'recvonly' });
                pc.addTransceiver('audio', { direction: 'recvonly' });

                dataChannel = pc.createDataChannel('control');
                setupInputEvents();

                // Medien-Tracks (Video/Audio) empfangen
                pc.ontrack = (event) => {
                    if (video.srcObject !== event.streams[0]) {
                        video.srcObject = event.streams[0];
                        updateStatus("Stream aktiv");
                    }
                };

                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        ws.send(JSON.stringify({ ice: event.candidate }));
                    }
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                ws.send(JSON.stringify({
                    sdp: pc.localDescription.sdp,
                    type: pc.localDescription.type
                }));
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                
                if (data.sdp) {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                } else if (data.ice) {
                    await pc.addIceCandidate(new RTCIceCandidate(data.ice));
                }
            };

            ws.onerror = () => {
                updateStatus("Fehler bei der WebSocket-Verbindung.");
            };
        }

        function setupInputEvents() {
            video.addEventListener('mousemove', (e) => {
                if (dataChannel && dataChannel.readyState === 'open') {
                    const rect = video.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width;
                    const y = (e.clientY - rect.top) / rect.height;
                    
                    if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                        dataChannel.send(JSON.stringify({ type: 'mousemove', x: x, y: y }));
                    }
                }
            });

            video.addEventListener('mousedown', (e) => {
                if (dataChannel && dataChannel.readyState === 'open') {
                    dataChannel.send(JSON.stringify({ type: 'click', button: e.button }));
                }
            });

            document.addEventListener('keydown', (e) => {
                // PIN Eingabe nicht mehr übermitteln, nur wenn Video sichtbar
                if (videoContainer.style.display !== 'none' && dataChannel && dataChannel.readyState === 'open') {
                    dataChannel.send(JSON.stringify({ type: 'keydown', key: e.key }));
                    e.preventDefault();
                }
            });

            document.addEventListener('keyup', (e) => {
                if (videoContainer.style.display !== 'none' && dataChannel && dataChannel.readyState === 'open') {
                    dataChannel.send(JSON.stringify({ type: 'keyup', key: e.key }));
                    e.preventDefault();
                }
            });
        }
    </script>
</body>
</html>
