<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Control Client</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: sans-serif;
        }
        #videoContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            cursor: crosshair;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="videoContainer">
        <video id="remoteVideo" autoplay playsinline></video>
        <div id="status">Verbinde zum Signaling Server...</div>
    </div>

    <script>
        // Ersetze dies mit deinem API Key von piesocket.com
        const PIESOCKET_API_KEY = "dNUjU3XDvFsQcLKs4BQ3q1Q2opjuDVSW7sqRb5b9";
        const CLUSTER_ID = "free.blr2"; 
        const SIGNALING_URL = `wss://${CLUSTER_ID}.piesocket.com/v3/1?api_key=${PIESOCKET_API_KEY}&notify_self=0`;

        const video = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        
        let ws;
        let pc;
        let dataChannel;

        function updateStatus(text) {
            statusDiv.innerText = text;
        }

        function initConnection() {
            ws = new WebSocket(SIGNALING_URL);

            ws.onopen = async () => {
                updateStatus("Verbunden. Starte WebRTC...");
                
                // Kostenlose Google STUN Server verwenden
                pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                // DataChannel fuer Maus und Tastatur erstellen
                dataChannel = pc.createDataChannel('control');
                setupInputEvents();

                // Video-Track empfangen
                pc.ontrack = (event) => {
                    if (video.srcObject !== event.streams[0]) {
                        video.srcObject = event.streams[0];
                        updateStatus("Stream aktiv");
                    }
                };

                // ICE Candidates an Python senden
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        ws.send(JSON.stringify({ ice: event.candidate }));
                    }
                };

                // Offer erstellen und senden
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                ws.send(JSON.stringify({
                    sdp: pc.localDescription.sdp,
                    type: pc.localDescription.type
                }));
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                
                if (data.sdp) {
                    await pc.setRemoteDescription(new RTCSessionDescription(data));
                } else if (data.ice) {
                    await pc.addIceCandidate(new RTCIceCandidate(data.ice));
                }
            };

            ws.onerror = () => {
                updateStatus("Fehler bei der WebSocket-Verbindung.");
            };
        }

        function setupInputEvents() {
            video.addEventListener('mousemove', (e) => {
                if (dataChannel && dataChannel.readyState === 'open') {
                    const rect = video.getBoundingClientRect();
                    // Berechnung der relativen Koordinaten (0.0 bis 1.0)
                    const x = (e.clientX - rect.left) / rect.width;
                    const y = (e.clientY - rect.top) / rect.height;
                    
                    if (x >= 0 && x <= 1 && y >= 0 && y <= 1) {
                        dataChannel.send(JSON.stringify({ type: 'mousemove', x: x, y: y }));
                    }
                }
            });

            video.addEventListener('mousedown', (e) => {
                if (dataChannel && dataChannel.readyState === 'open') {
                    dataChannel.send(JSON.stringify({ type: 'click', button: e.button }));
                }
            });

            document.addEventListener('keydown', (e) => {
                if (dataChannel && dataChannel.readyState === 'open') {
                    dataChannel.send(JSON.stringify({ type: 'keydown', key: e.key }));
                }
            });

            document.addEventListener('keyup', (e) => {
                if (dataChannel && dataChannel.readyState === 'open') {
                    dataChannel.send(JSON.stringify({ type: 'keyup', key: e.key }));
                }
            });
        }

        // Starten
        initConnection();
    </script>
</body>
</html>
